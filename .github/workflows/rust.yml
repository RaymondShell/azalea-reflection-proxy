name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    # v4.2.2, pinned so a mutable action tag cannot change the build.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    # azalea uses nightly-only features (min_specialization,
    # generic_const_exprs, ...); the runner's preinstalled Rust is
    # stable, so the build fails without this. Channel is pinned in
    # rust-toolchain.toml so CI and local builds agree.
    - name: Install nightly toolchain
      run: rustup toolchain install nightly-2026-06-30 --profile minimal --component clippy,rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check all targets
      run: cargo check --locked --all-targets --all-features
    - name: Lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --locked --all-targets --all-features
    - name: Check package contents
      run: cargo package --locked --no-verify
    - name: Check documentation
      run: cargo doc --locked --no-deps --all-features
