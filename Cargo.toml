[package]
name = "azalea-reflection-proxy"
version = "0.1.6"
edition = "2021"
publish = false
description = "Spectate and take over an azalea bot session live through a local reflection proxy — Rust port of mineflayer-reflection-proxy"
license = "MIT"
repository = "https://github.com/RaymondShell/azalea-reflection-proxy"
readme = "README.md"
keywords = ["minecraft", "azalea", "proxy", "bot", "spectator"]
categories = ["game-development", "network-programming"]
# requires nightly (azalea uses unstable features); docs.rs already
# builds with nightly by default
exclude = [".github/", ".idea/"]

[dependencies]
# Track the fork's latest `main` so the proxy and bot resolve one shared
# protocol stack rather than compiling separate Azalea revisions.
azalea-protocol = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-auth = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-crypto = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-buf = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-chat = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-core = { git = "https://github.com/RaymondShell/azalea", branch = "main", features = ["bevy_ecs"] }
azalea-entity = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-registry = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
azalea-inventory = { git = "https://github.com/RaymondShell/azalea", branch = "main" }
# same crate/version azalea-client uses to locate ~/.minecraft, so the
# proxy's auth cache path is identical to Account::microsoft's
minecraft_folder_path = "0.1.2"

tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1.4"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
